services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: incidentzero_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: incidentzero
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d incidentzero"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
